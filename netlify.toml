[build]
  command = "npm run build"
  publish = "dist"

# Old visl.ai/new links -> root
[[redirects]]
  from = "/new/*"
  to = "/:splat"
  status = 301

# Old Visl AI Labs site, proxied from its own Netlify project
[[redirects]]
  from = "/labs"
  to = "https://inquisitive-klepon-cd2ed6.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/labs/*"
  to = "https://inquisitive-klepon-cd2ed6.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Build output has hashed file names, so it can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media keeps its file name: give a replaced file a new name to bust this cache
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/benefits/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/background/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
